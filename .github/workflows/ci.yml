name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect test coverage
        id: coverage
        continue-on-error: true
        run: pnpm test --coverage
      - name: Collect vulnerability findings
        id: audit
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=critical --json > audit.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report CI results on pull request
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          marker='<!-- fitness-app-ci-report -->'
          deployment_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr-${PR_NUMBER}/"

          if [[ -f coverage/coverage-summary.json ]]; then
            coverage_rows=$(jq -r '
              .total |
              ["Statements", .statements.pct],
              ["Branches", .branches.pct],
              ["Functions", .functions.pct],
              ["Lines", .lines.pct] |
              "| \(.[0]) | \(.[1])% |"
            ' coverage/coverage-summary.json)
          else
            coverage_rows='| Coverage | unavailable |'
          fi

          audit_summary=$(jq -r '
            .metadata.vulnerabilities |
            "Critical: \(.critical), High: \(.high), Moderate: \(.moderate), Low: \(.low)"
          ' audit.json)
          audit_findings=$(jq -r '
            (.vulnerabilities // {}) | to_entries |
            if length == 0 then "| None | — | No vulnerabilities found | — |"
            else
              map(
                .value as $v |
                ([$v.via[]? | select(type == "object")] | first) as $advisory |
                ($advisory.title // "Vulnerability reported" | gsub("\\|"; "\\\\|")) as $title |
                ($advisory.url // "—") as $url |
                "| `\(.key)` | \($v.severity | ascii_upcase) | \($title) | \($url) |"
              ) |
              join("\n")
            end
          ' audit.json)

          {
            echo "$marker"
            echo '## CI report'
            echo
            echo '### Test coverage'
            echo
            echo '| Metric | Coverage |'
            echo '| --- | ---: |'
            echo "$coverage_rows"
            echo
            echo '### Vulnerabilities'
            echo
            echo "Summary: $audit_summary"
            echo
            echo '| Package | Severity | Advisory | Reference |'
            echo '| --- | --- | --- | --- |'
            echo "$audit_findings"
            echo
            echo '### Deployment'
            echo
            echo "[Open PR preview]($deployment_url)"
          } > ci-report.md

          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate \
            --jq 'map(select(.body | startswith("<!-- fitness-app-ci-report -->")))[0].id // empty')

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --raw-field body="$(<ci-report.md)"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --raw-field body="$(<ci-report.md)"
          fi
      - name: Run verification
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm build
      - name: Enforce coverage and vulnerability checks
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          IS_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [[ "$COVERAGE_OUTCOME" != 'success' ]]; then
            echo 'Test coverage failed.'
            exit 1
          fi
          if [[ "$IS_DRAFT_PR" != 'true' && "$AUDIT_EXIT_CODE" != '0' ]]; then
            echo 'Critical vulnerabilities found.'
            exit 1
          fi
